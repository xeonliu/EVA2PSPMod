[PATCHES]
; Encoding
EnableExtendCharset=1            ; SJIS→UTF16，支持中文范围0xA6-0xDD
EnableCharTranslationHook=1     ; 字符翻译钩子，配合EnableExtendCharset使用

; Font
EnableCustomFontPatch=1          ; sceFttt字体库替换

; Translation in EBOOT.BIN (UTF-16 and UTF-8)
EnableStringPatches=1            ; 硬编码中文字符串替换
EnableExternalTranslation=1      ; 动态加载外部翻译表

; PSP System Patches
EnableSaveDataPatch=1            ; sceUtilitySavedata系列(6处)
EnableMessageDialogPatch=1       ; 消息对话框参数修正

[CHEATS]
EnablePulseAutowin=0             ; Pulse Autowin (脉冲自动胜利)

[PATHS]
ExternalTransFile=disc0:/PSP_GAME/USRDIR/EBTRANS.BIN
ExternalFontFile=disc0:/PSP_GAME/USRDIR/EBFONT.PGF

[DEBUG]
EnableBattleDebugMenu=0          ; 战斗调试菜单
EnableDailyDebugMenu=0           ; 日常调试菜单
EnableMemTalkDebug=0             ; MemTalk原逻辑复刻+阶段日志，输出ms0:/PSP/memtalk_debug.log
EnableLogging=1
